<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}EthicsEdu{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Rubik', sans-serif; background-color: #f8fbff; }
        .navbar { box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        footer { background: white; text-align: center; padding: 30px 0; color: #888; border-top: 1px solid #eaeaea; margin-top: 60px; }
    </style>
</head>
<body>

<!-- Навигация -->
<nav class="navbar navbar-expand-lg navbar-light bg-white px-3">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'home' %}">EthicsEdu</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
            <ul class="navbar-nav">
                {% if user.is_authenticated %}
                    <li class="nav-item"><a class="nav-link" href="{% url 'profile' %}">Профиль</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'about' %}">О проекте</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'literature' %}">Литература</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'videos' %}">Видео</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'articles' %}">Статьи</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'logout' %}">Выйти</a></li>
                {% else %}
                    <li class="nav-item"><a class="nav-link" href="{% url 'login' %}">Войти</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'register' %}">Регистрация</a></li>
                {% endif %}
            </ul>
        </div>
    </div>
</nav>

<!-- Контент -->
<main class="container my-5">
    {% block content %}
    {% endblock %}
</main>

<footer>
    &copy; 2025 EthicsEdu — Все права защищены.
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

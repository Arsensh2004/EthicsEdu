<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <title>{{ lesson.title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(to right, #e3f2fd, #ffffff);
            font-family: 'Rubik', sans-serif;
        }
        .lesson-header {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .lesson-body {
            background-color: #ffffff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.03);
        }
        .btn-back {
            color: #0d47a1;
            font-weight: 500;
            text-decoration: none;
        }
        .btn-back:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <a href="/" class="btn-back d-inline-block mb-3">&larr; Басты бетке оралу</a>

        <div class="lesson-header mb-4">
            <h1 class="text-primary fw-bold">{{ lesson.title }}</h1>
            <p class="text-muted">Жарияланған күні: {{ lesson.created_at|date:"d.m.Y H:i" }}</p>
        </div>

        <div class="lesson-body">
            {{ lesson.content|linebreaks }}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

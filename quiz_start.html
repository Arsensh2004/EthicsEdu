<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Начать тест</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Rubik', sans-serif;
            background-color: #e8f4fc;
        }
        .card-start {
            background-color: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            max-width: 700px;
            margin: 80px auto;
            text-align: center;
        }
        .btn-start {
            background-color: #00bcd4;
            color: white;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: 0.3s;
        }
        .btn-start:hover {
            background-color: #00acc1;
        }
    </style>
</head>
<body>
<div class="card-start">
    <h1 class="mb-3">Тест на знание словесной этики</h1>
    <p class="mb-4">Проверь свои знания в сфере речевой культуры. Тест состоит из нескольких вопросов. Выбери правильные варианты.</p>
    <a href="{% url 'quiz_run' %}" class="btn btn-start">Начать тест</a>
</div>
</body>
</html>

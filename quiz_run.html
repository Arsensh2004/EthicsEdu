<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Тестирование</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Rubik', sans-serif;
            background-color: #f0f4f8;
        }
        .test-container {
            max-width: 800px;
            margin: 60px auto;
            background-color: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
        }
        .question {
            margin-bottom: 30px;
        }
        .question h5 {
            font-weight: 600;
        }
        .btn-submit {
            background-color: #00bcd4;
            color: white;
            font-weight: 600;
            padding: 10px 25px;
            border-radius: 8px;
            transition: 0.3s;
        }
        .btn-submit:hover {
            background-color: #00acc1;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h2 class="mb-4 text-center">Пройди тест</h2>
        <form method="post">
            {% csrf_token %}
            {% for question in questions %}
                <div class="question">
                    <h5>{{ forloop.counter }}. {{ question.text }}</h5>
                    {% for answer in question.answers.all %}
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="{{ question.id }}" value="{{ answer.id }}" id="answer{{ answer.id }}">
                            <label class="form-check-label" for="answer{{ answer.id }}">
                                {{ answer.text }}
                            </label>
                        </div>
                    {% endfor %}
                </div>
            {% endfor %}
            <div class="text-center mt-4">
                <button type="submit" class="btn btn-submit">Завершить тест</button>
            </div>
        </form>
    </div>
</body>
</html>

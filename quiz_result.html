<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Результат теста</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Rubik', sans-serif;
            background-color: #f0f9ff;
        }
        .result-box {
            max-width: 600px;
            margin: 80px auto;
            background-color: #ffffff;
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
        }
        .score {
            font-size: 2.5rem;
            font-weight: 700;
            color: #007bff;
        }
        .message {
            font-size: 1.2rem;
            margin-top: 15px;
        }
        .btn-back {
            margin-top: 30px;
            padding: 10px 25px;
            border-radius: 8px;
            background-color: #00bcd4;
            color: white;
            font-weight: 600;
            text-decoration: none;
        }
        .btn-back:hover {
            background-color: #00acc1;
        }
    </style>
</head>
<body>
    <div class="result-box">
        <h2>Результаты теста</h2>
        <p class="score">{{ score }} / {{ total }}</p>
        <p class="message">
            {% if score|floatformat:0 >= total|add:"0"|floatformat:0|floatformat:"0"|floatformat:0|divisibleby:2 %}
                Отличный результат! Продолжайте в том же духе!
            {% else %}
                Есть над чем поработать — попробуйте ещё раз!
            {% endif %}
        </p>
        <a href="/" class="btn-back">На главную</a>
    </div>
</body>
</html>
